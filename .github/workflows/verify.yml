name: Documentation verification
on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python3 tests/verify.py
      - run: node --check assets/site.js && node --check assets/marquee.js
      - name: Check canonical design configuration
        run: |
          revision=$(git ls-remote https://github.com/NamTheDev/util.git refs/heads/main | cut -f1)
          for asset in config.css shell.css marquee.js; do
            curl -fsSL "https://raw.githubusercontent.com/NamTheDev/util/$revision/design/$asset" -o "/tmp/$asset"
            cmp "assets/$asset" "/tmp/$asset"
          done
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 marked@15.0.12 dompurify@3.2.6
      - run: npx playwright install chromium
      - run: node --test tests/browser.test.cjs
