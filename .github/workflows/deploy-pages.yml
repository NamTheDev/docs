name: Deploy documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  commit-format:
    uses: ./.github/workflows/commit-message-format.yml
  ai-disclosure:
    uses: ./.github/workflows/ai-disclosure-format.yml
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    needs: [commit-format, ai-disclosure, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r index.html manifest.json .nojekyll assets pages projects LICENSE LICENSE.bootstrap THIRD_PARTY_NOTICES.md AI_DISCLAIMER.md dist/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify uploaded artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact not available" >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
