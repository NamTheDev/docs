name: Deploy documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/verify.py
      - run: node --check assets/site.js && node --check assets/theme.js
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp -r index.html manifest.json .nojekyll assets pages projects LICENSE LICENSE.bootstrap THIRD_PARTY_NOTICES.md AI_DISCLAIMER.md dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify uploaded artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact not available" >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
